# Pre-commit hooks — mechanical enforcement before commit
# Install: pre-commit install
# Run manually: pre-commit run --all-files

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.5
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: biome-check
        name: biome check (format + lint + organize imports)
        entry: biome check --write
        language: node
        additional_dependencies: ['@biomejs/biome@2.5.5']
        files: \.(json|jsonc|js|jsx|ts|tsx)$
        exclude: ^(tests/fixtures/|tests/compatibility/fixtures/)
