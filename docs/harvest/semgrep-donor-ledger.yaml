# Donor Semgrep rule harvest ledger (SDK ADR 0020, L9-CI-SDK-004).
#
# One row per donor rule: 8 (Enrichment.Inference.Engine) + 8
# (Cognitive.Engine.Graphs) + 4 (Cursor-Governance) + 39 (IB-Odoo_19) = 59.
#
# Every "evidence" sentence records what the real semgrep executable
# (metadata.semgrep_version) reported on metadata.observed_at for the donor
# rule file at the exact head and blob in the row. Line numbers refer to the
# fixture named beside them. Rules that stay at their owner are not in this
# repository, so the SDK's own CI cannot re-run their evidence;
# metadata.reproduce re-runs all of it from donor checkouts.
#
# Dispositions use the campaign's seven values. A row is evidence for a
# decision the owner makes. It retires no rule anywhere.
schema: l9.semgrep-harvest-ledger/v1
metadata:
  campaign: L9-CI-UNIFIED-LEVERAGE-2026-11-20-v1.7.1
  lane: L1
  observed_at: '2026-11-20'
  semgrep_version: 1.171.0
  reproduce: python scripts/harvest_donor_evidence.py --eie PATH --ceg PATH --cursor PATH --odoo
    PATH
  status: evidence; a disposition here admits nothing and retires nothing
rows:
- rule_id: no-datetime-utcnow
  donor:
    repository: Quantum-L9/Enrichment.Inference.Engine
    ref: main
    head: 0a09593ee8b1313f2a1811febfd9ad3bb39531b6
    path: .semgrep/semgrep-rules.yaml
    blob: 753352355f0cde213c7b0f6244523cc3411e5d26
  behavior: Flags every call to datetime.utcnow(). Pattern is identical in both donors.
  scope: python; **/*.py; excludes tests/, scripts/, venv/, .venv/ and 'Current Work/' at the
    repository root
  disposition: promote_language
  sdk_rule: l9.python.portable.datetime-utcnow
  rationale: Portable Python correctness rule with one unambiguous pattern, identical in two independent
    consumers. Carried as a shadow-mode derivative in the candidate python-portable pack; the
    donors' path excludes are product settings and were not carried.
  witnesses:
    known_bad:
      fixture: tests/fixtures/semgrep/rules/packs/python-portable/l9-python-portable.py
      source: authored
      evidence: Donor rule flags line [157]; the SDK derivative flags line [157] (datetime.utcnow()).
    known_good:
      fixture: tests/fixtures/semgrep/rules/packs/python-portable/l9-python-portable.py
      source: authored
      evidence: Neither rule flags datetime.now(UTC) or datetime.fromtimestamp(stamp, tz=UTC).
        Enforced by semgrep --test on the ok annotations.
    non_target:
      kind: not_composed
      evidence: l9.python.portable.datetime-utcnow is selected by the python language fact only.
        tests/rulesets/test_rulepack_composition.py asserts that a typescript-only composition
        carries no python rule.
  retirement: None. The donor rule stays in place at its owner. No consumer check is retired before
    CURSOR_CANARY_PASS (L9-CI-CORE-004).
