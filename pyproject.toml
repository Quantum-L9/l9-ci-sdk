[build-system]
requires = ["hatchling>=1.31.0"]
build-backend = "hatchling.build"

[project]
name = "l9-ci"
version = "2.0.0"
description = "Canonical CI observations, provider adapters, normalized findings, validation, and deterministic artifact generation for Quantum-L9."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "jsonschema==4.26.0",
    "referencing==0.37.0",
    "PyYAML==6.0.3",
]

[project.optional-dependencies]
ci = [
    "ruff==0.16.0",
    "mypy==2.3.0",
    "types-PyYAML==6.0.12.20260724",
    "types-jsonschema==4.26.0.20260518",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "rfc3339-validator==0.1.4",
]

[project.scripts]
l9-ci = "l9_ci.__main__:main"

[project.urls]
Repository = "https://github.com/Quantum-L9/l9-ci-sdk"

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["memory-bank", ".git", ".venv", "venv", "node_modules"]

[tool.hatch.build.targets.wheel]
packages = ["l9_ci"]

[tool.coverage.run]
branch = true
source = ["l9_ci"]

[tool.coverage.report]
show_missing = true
fail_under = 80
