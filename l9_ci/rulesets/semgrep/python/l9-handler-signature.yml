# --- L9_META ---
# l9_schema: 1
# origin: l9-ci-universal-base
# layer: [ci, semgrep, handler]
# tags: [L9_TEMPLATE, TransportPacket, handler-signature, shadow-mode]
# owner: platform
# status: active
# --- /L9_META ---
rules:
  - id: l9.handler.dict-packet-parameter
    languages: [python]
    severity: WARNING
    message: Handler packet parameter must be TransportPacket, not dict.
    metadata:
      l9:
        canonical_rule_id: AST-HANDLER-001
      mode: shadow
      contract: handler_signature
      autofix_safe: false
    pattern-either:
      - pattern: |
          async def $F(packet: dict, ...) -> $RET:
            ...
      - pattern: |
          def $F(packet: dict, ...) -> $RET:
            ...

  - id: l9.handler.raw-payload-parameter
    languages: [python]
    severity: WARNING
    message: Handler must accept a TransportPacket boundary object, not raw payload/input dictionaries.
    metadata:
      l9:
        canonical_rule_id: AST-HANDLER-002
      mode: shadow
      contract: handler_signature
      autofix_safe: false
    # Was any `async def` whose first parameter is payload/input/data, so it
    # reported ordinary helpers: Enrichment.Inference.Engine (12d8b351) was
    # blocked by a Perplexity HTTP client, query_perplexity(payload, api_key),
    # and an inner concurrency helper, _call_variation(payload). Neither is a
    # handler. The packet-slot shape is unchanged; the function must now also
    # BE a handler, by one of:
    #   * its name: handle, handler, handle_<x>, <x>_handler;
    #   * a decorator named like a handler registration (@register_handler(...),
    #     @router.handler(...));
    #   * being passed to a register/handler call in the same module
    #     (register_handler("enrich", enrich)).
    # The plain `async def` pattern never matched a DECORATED function, so a
    # decorated handler with a raw payload slot was invisible before; the
    # decorated shapes are now matched explicitly. A handler registered only
    # from another module, under a non-handler name, is out of view.
    patterns:
      - pattern-either:
          # A handler by name, decorated or not.
          - patterns:
              - pattern-either:
                  - pattern: |
                      async def $F($P: $T, ...) -> $RET:
                        ...
                  - pattern: |
                      @$DEC(...)
                      async def $F($P: $T, ...) -> $RET:
                        ...
                  - pattern: |
                      @$DEC
                      async def $F($P: $T, ...) -> $RET:
                        ...
              - metavariable-regex:
                  metavariable: $F
                  regex: (?i)^_*(?:handle|handler)(?:_[a-z0-9_]*)?$|^_*[a-z0-9_]*_handler$
          # A handler by registration decorator.
          - patterns:
              - pattern-either:
                  - pattern: |
                      @$DEC(...)
                      async def $F($P: $T, ...) -> $RET:
                        ...
                  - pattern: |
                      @$DEC
                      async def $F($P: $T, ...) -> $RET:
                        ...
              - metavariable-regex:
                  metavariable: $DEC
                  regex: (?i)^(?:[a-z0-9_]+\.)*[a-z0-9_]*handler[a-z0-9_]*$
          # A handler by registration in the same module.
          - patterns:
              - pattern-inside: |
                  async def $F(...) -> $RET:
                    ...
                  ...
                  $REG(..., $F, ...)
              - pattern: |
                  async def $F($P: $T, ...) -> $RET:
                    ...
              - metavariable-regex:
                  metavariable: $REG
                  regex: (?i)^(?:[a-z0-9_]+\.)*[a-z0-9_]*(?:register|handler)[a-z0-9_]*$
      # The packet slot (first parameter) holds a raw payload/input dictionary.
      - metavariable-regex:
          metavariable: $P
          regex: ^(payload|input|data)$

  - id: l9.handler.non-async-handler
    languages: [python]
    severity: WARNING
    message: Node handler functions must be async and return TransportPacket.
    metadata:
      l9:
        canonical_rule_id: AST-HANDLER-003
      mode: shadow
      contract: handler_signature
      autofix_safe: false
    pattern: |
      def handler(packet: TransportPacket) -> TransportPacket:
        ...

  - id: l9.handler.missing-transportpacket-return
    languages: [python]
    severity: WARNING
    message: Handler return annotation should be TransportPacket.
    metadata:
      l9:
        canonical_rule_id: AST-HANDLER-004
      mode: shadow
      contract: handler_signature
      autofix_safe: false
    # `metavariable-regex` must be an item of a `patterns` list; as a sibling
    # of `pattern` it is silently dropped and the rule flags every async
    # handler, including the compliant `-> TransportPacket` signature.
    patterns:
      - pattern: |
          async def handler(packet: TransportPacket) -> $RET:
            ...
      - metavariable-regex:
          metavariable: $RET
          regex: '^(?!TransportPacket$).+'
