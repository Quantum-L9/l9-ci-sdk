# --- L9_META ---
# l9_schema: 1
# origin: l9-ci-universal-base
# layer: [ci, semgrep, routing]
# tags: [L9_TEMPLATE, GateClient, routing, shadow-mode]
# owner: platform
# status: active
# --- /L9_META ---
rules:
  - id: l9.routing.requests-direct-node-dispatch
    languages: [python]
    severity: WARNING
    message: Direct node dispatch via requests is forbidden. Route follow-up work through GateClient.send_to_gate(packet).
    metadata:
      l9:
        canonical_rule_id: AST-ROUTING-001
      mode: shadow
      contract: Gate_only_routing
      autofix_safe: false
    # Was `requests.post($URL, ...)`: every requests.post() in the repository, whatever
    # it called. Enrichment.Inference.Engine (12d8b351) was blocked by its
    # Salesforce OAuth token request and its HubSpot search call, neither of
    # which is an L9 node. The rule is now a taint rule over the DESTINATION:
    # it reports a requests call only when its target is, or is built from
    # (concatenation, f-string, local variable, a nested call such as
    # os.getenv("GATE_URL")), an L9 node/peer/Gate destination -- a literal
    # service URL on the node port or a *.internal host, an /execute route,
    # or a name or setting key shaped like <node|peer|gate|ceg|eie|...>_url /
    # _endpoint / _host. It covers every dispatching verb (post, put, patch,
    # request, stream), url= keywords, and requests.Session instances
    # created in scope. Third-party HTTP, and GET reads, are not node
    # dispatch. AST-ROUTING-004 still reports any client's /execute dispatch.
    mode: taint
    pattern-sources:
      # A destination literal: an internal service on the node port, a
      # *.internal host, an /execute route, or a setting/env key named like
      # an L9 destination (os.getenv("GATE_URL"), settings["ceg_url"]).
      - patterns:
          - pattern: '"$LIT"'
          - metavariable-regex:
              metavariable: $LIT
              regex: (?i)^["']?(?:https?://[a-z0-9-]+:8000(?:/.*)?|https?://[a-z0-9.-]+\.internal(?:[:/].*)?|.*/(?:v1/)?execute|_*(?:[a-z0-9]+_)*(?:node|nodes|peer|peers|gate|ceg|eie|constellation|chassis|cognitive_engine|inference_engine|graph_engine)(?:_[a-z0-9]+)*_(?:url|urls|uri|endpoint|endpoints|host|address|addr))["']?$
      # An identifier or attribute NAMED like an L9 node/peer/Gate destination
      # (GATE_URL, settings.ceg_base_url, self._peer_node_url).
      - patterns:
          - pattern: $DEST
          - metavariable-regex:
              metavariable: $DEST
              regex: (?i)^_*(?:[a-z0-9]+_)*(?:node|nodes|peer|peers|gate|ceg|eie|constellation|chassis|cognitive_engine|inference_engine|graph_engine)(?:_[a-z0-9]+)*_(?:url|urls|uri|endpoint|endpoints|host|address|addr)$
      - patterns:
          - pattern: $OBJ.$DEST
          - metavariable-regex:
              metavariable: $DEST
              regex: (?i)^_*(?:[a-z0-9]+_)*(?:node|nodes|peer|peers|gate|ceg|eie|constellation|chassis|cognitive_engine|inference_engine|graph_engine)(?:_[a-z0-9]+)*_(?:url|urls|uri|endpoint|endpoints|host|address|addr)$
      # An identifier named like an execute route (AST-ROUTING-004's source),
      # which covers a constant imported from another module.
      - patterns:
          - pattern: $ROUTE
          - metavariable-regex:
              metavariable: $ROUTE
              regex: (?i)^_*[a-z0-9_]*execute_(path|url|uri|endpoint|route)$
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: requests.$METHOD($TARGET, ...)
              - pattern: requests.$METHOD(..., url=$TARGET, ...)
              - patterns:
                  - pattern-either:
                      - pattern-inside: |
                          $S = requests.$CLS(...)
                          ...
                      - pattern-inside: |
                          with requests.$CLS(...) as $S:
                            ...
                      - pattern-inside: |
                          async with requests.$CLS(...) as $S:
                            ...
                  - metavariable-regex:
                      metavariable: $CLS
                      regex: ^(Session)$
                  - pattern-either:
                      - pattern: $S.$METHOD($TARGET, ...)
                      - pattern: $S.$METHOD(..., url=$TARGET, ...)
          - metavariable-regex:
              metavariable: $METHOD
              regex: ^(post|put|patch|stream)$
          - focus-metavariable: $TARGET
      # request()/stream() take the HTTP verb first.
      - patterns:
          - pattern-either:
              - pattern: requests.$METHOD($VERB, $TARGET, ...)
              - patterns:
                  - pattern-either:
                      - pattern-inside: |
                          $S = requests.$CLS(...)
                          ...
                      - pattern-inside: |
                          with requests.$CLS(...) as $S:
                            ...
                      - pattern-inside: |
                          async with requests.$CLS(...) as $S:
                            ...
                  - metavariable-regex:
                      metavariable: $CLS
                      regex: ^(Session)$
                  - pattern: $S.$METHOD($VERB, $TARGET, ...)
          - metavariable-regex:
              metavariable: $METHOD
              regex: ^(request|stream)$
          - focus-metavariable: $TARGET

  - id: l9.routing.httpx-direct-node-dispatch
    languages: [python]
    severity: WARNING
    message: Direct node dispatch via httpx is forbidden. Route follow-up work through GateClient.send_to_gate(packet).
    metadata:
      l9:
        canonical_rule_id: AST-ROUTING-002
      mode: shadow
      contract: Gate_only_routing
      autofix_safe: false
    # Was `httpx.post($URL, ...)`: every httpx.post() in the repository, whatever
    # it called. Enrichment.Inference.Engine (12d8b351) was blocked by its
    # Salesforce OAuth token request and its HubSpot search call, neither of
    # which is an L9 node. The rule is now a taint rule over the DESTINATION:
    # it reports a httpx call only when its target is, or is built from
    # (concatenation, f-string, local variable, a nested call such as
    # os.getenv("GATE_URL")), an L9 node/peer/Gate destination -- a literal
    # service URL on the node port or a *.internal host, an /execute route,
    # or a name or setting key shaped like <node|peer|gate|ceg|eie|...>_url /
    # _endpoint / _host. It covers every dispatching verb (post, put, patch,
    # request, stream), url= keywords, and httpx.Client / AsyncClient instances
    # created in scope. Third-party HTTP, and GET reads, are not node
    # dispatch. AST-ROUTING-004 still reports any client's /execute dispatch.
    mode: taint
    pattern-sources:
      # A destination literal: an internal service on the node port, a
      # *.internal host, an /execute route, or a setting/env key named like
      # an L9 destination (os.getenv("GATE_URL"), settings["ceg_url"]).
      - patterns:
          - pattern: '"$LIT"'
          - metavariable-regex:
              metavariable: $LIT
              regex: (?i)^["']?(?:https?://[a-z0-9-]+:8000(?:/.*)?|https?://[a-z0-9.-]+\.internal(?:[:/].*)?|.*/(?:v1/)?execute|_*(?:[a-z0-9]+_)*(?:node|nodes|peer|peers|gate|ceg|eie|constellation|chassis|cognitive_engine|inference_engine|graph_engine)(?:_[a-z0-9]+)*_(?:url|urls|uri|endpoint|endpoints|host|address|addr))["']?$
      # An identifier or attribute NAMED like an L9 node/peer/Gate destination
      # (GATE_URL, settings.ceg_base_url, self._peer_node_url).
      - patterns:
          - pattern: $DEST
          - metavariable-regex:
              metavariable: $DEST
              regex: (?i)^_*(?:[a-z0-9]+_)*(?:node|nodes|peer|peers|gate|ceg|eie|constellation|chassis|cognitive_engine|inference_engine|graph_engine)(?:_[a-z0-9]+)*_(?:url|urls|uri|endpoint|endpoints|host|address|addr)$
      - patterns:
          - pattern: $OBJ.$DEST
          - metavariable-regex:
              metavariable: $DEST
              regex: (?i)^_*(?:[a-z0-9]+_)*(?:node|nodes|peer|peers|gate|ceg|eie|constellation|chassis|cognitive_engine|inference_engine|graph_engine)(?:_[a-z0-9]+)*_(?:url|urls|uri|endpoint|endpoints|host|address|addr)$
      # An identifier named like an execute route (AST-ROUTING-004's source),
      # which covers a constant imported from another module.
      - patterns:
          - pattern: $ROUTE
          - metavariable-regex:
              metavariable: $ROUTE
              regex: (?i)^_*[a-z0-9_]*execute_(path|url|uri|endpoint|route)$
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: httpx.$METHOD($TARGET, ...)
              - pattern: httpx.$METHOD(..., url=$TARGET, ...)
              - patterns:
                  - pattern-either:
                      - pattern-inside: |
                          $S = httpx.$CLS(...)
                          ...
                      - pattern-inside: |
                          with httpx.$CLS(...) as $S:
                            ...
                      - pattern-inside: |
                          async with httpx.$CLS(...) as $S:
                            ...
                  - metavariable-regex:
                      metavariable: $CLS
                      regex: ^(Client|AsyncClient)$
                  - pattern-either:
                      - pattern: $S.$METHOD($TARGET, ...)
                      - pattern: $S.$METHOD(..., url=$TARGET, ...)
          - metavariable-regex:
              metavariable: $METHOD
              regex: ^(post|put|patch|stream)$
          - focus-metavariable: $TARGET
      # request()/stream() take the HTTP verb first.
      - patterns:
          - pattern-either:
              - pattern: httpx.$METHOD($VERB, $TARGET, ...)
              - patterns:
                  - pattern-either:
                      - pattern-inside: |
                          $S = httpx.$CLS(...)
                          ...
                      - pattern-inside: |
                          with httpx.$CLS(...) as $S:
                            ...
                      - pattern-inside: |
                          async with httpx.$CLS(...) as $S:
                            ...
                  - metavariable-regex:
                      metavariable: $CLS
                      regex: ^(Client|AsyncClient)$
                  - pattern: $S.$METHOD($VERB, $TARGET, ...)
          - metavariable-regex:
              metavariable: $METHOD
              regex: ^(request|stream)$
          - focus-metavariable: $TARGET

  - id: l9.routing.hardcoded-peer-node-url
    languages: [python]
    severity: WARNING
    message: Hardcoded peer node URLs are forbidden in runtime/orchestrator code. Gate is routing authority.
    metadata:
      l9:
        canonical_rule_id: AST-ROUTING-003
      mode: shadow
      contract: Gate_only_routing
      autofix_safe: false
    # The `.internal` alternative was written `\\.` inside single quotes, which
    # YAML keeps verbatim, so the regex demanded a literal backslash and never
    # matched an https://<host>.internal URL. One backslash escapes the dot.
    pattern-regex: 'http://[a-z0-9-]+:8000|https://[a-z0-9-]+\.internal'

  - id: l9.routing.gateclient-bypass-execute
    languages: [python]
    severity: WARNING
    message: Raw /execute calls bypass GateClient and are forbidden for node follow-up work.
    metadata:
      l9:
        canonical_rule_id: AST-ROUTING-004
      mode: shadow
      contract: Gate_only_routing
      autofix_safe: false
    # History. The first form was a bare `/v1/execute|/execute` text search
    # over the whole file, which could not tell a call from prose: it fired on
    # the filename "references/execute.md", on the help text "Skip
    # paste/execute", on "kind/execute_via frontmatter", and on docstrings that
    # merely DESCRIBE the Gate-routed endpoint. The second form required a
    # string literal ending at the path, but was still a file-wide
    # `pattern-regex`, so it fired on a node's own INGRESS: the FastAPI route
    # definition of its single POST endpoint, and a module constant compared
    # against the inbound `request.url.path` (Cognitive.Engine.Graphs PR #409,
    # chassis/chassis_app.py and chassis/node_app.py). Neither dispatches
    # anything, and Contract 1 REQUIRES every node to serve that path.
    #
    # The rule is now a taint rule over OUTBOUND use. A /execute target is
    #   * a string literal ending at the path ("http://node:8000/v1/execute",
    #     "/execute"), including through a module constant
    #     (EXECUTE_PATH = "/v1/execute"), concatenation, an f-string
    #     (f"{base}/execute") or a local variable, or
    #   * an identifier NAMED like an execute route (EXECUTE_PATH,
    #     _EXECUTE_URL, ...), which covers a constant imported from another
    #     module, where the defining literal is out of view;
    # and it is reported only where it reaches the target of an HTTP client
    # call: requests/httpx/any client object `.post/.put/.patch/.request/
    # .send/.stream`, positionally or as `url=`. A route decorator on the
    # receiving side (`@app.post("/v1/execute")`) is excluded, as is anything
    # that never reaches such a call -- route tables (`add_api_route`), and
    # comparisons against the inbound path.
    #
    # Trade-off, stated deliberately: a bare `EXECUTE_PATH = "/v1/execute"`
    # assignment is no longer a finding by itself. That constant is exactly
    # what an ingress needs to define, so flagging every one makes every node
    # in the fleet fail on its own entry point; the constant is flagged where
    # it is USED to dispatch instead, in the defining module through taint and
    # in any importing module through its name. Direct dispatch by any path is
    # separately covered by AST-ROUTING-001/002.
    mode: taint
    pattern-sources:
      - pattern: '"=~/\\/(v1\\/)?execute$/"'
      - patterns:
          - pattern: $ROUTE
          - metavariable-regex:
              metavariable: $ROUTE
              regex: (?i)^_*[a-z0-9_]*execute_(path|url|uri|endpoint|route)$
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $CLIENT.$METHOD($TARGET, ...)
              - pattern: $CLIENT.$METHOD($VERB, $TARGET, ...)
              - pattern: $CLIENT.$METHOD(..., url=$TARGET, ...)
          - metavariable-regex:
              metavariable: $METHOD
              regex: ^(post|put|patch|request|send|stream)$
          # The receiving side: `@app.post("/v1/execute")` declares an ingress
          # route; it sends nothing. $CLIENT and $METHOD are the SAME
          # metavariables as the call above, so this excludes the decorator
          # call itself and nothing else -- a dispatch made from inside a
          # decorated handler (`await self.client.post(...)`) binds a different
          # $CLIENT and is still reported. `def` also matches `async def`.
          - pattern-not-inside: |
              @$CLIENT.$METHOD(...)
              def $HANDLER(...):
                  ...
          - focus-metavariable: $TARGET
