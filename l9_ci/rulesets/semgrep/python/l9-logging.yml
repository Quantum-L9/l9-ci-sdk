# --- L9_META ---
# l9_schema: 1
# origin: l9-ci-universal-base
# layer: [ci, semgrep, logging]
# tags: [L9_TEMPLATE, pii, secrets, shadow-mode]
# owner: platform
# status: active
# --- /L9_META ---
rules:
  - id: l9.logging.forbidden-secret-field
    languages: [python]
    severity: WARNING
    message: Forbidden secret-like value passed to logger. Do not log api_key, token, password, secret, raw_response, or llm_response.
    metadata:
      l9:
        canonical_rule_id: AST-LOGGING-001
      mode: shadow
      contract: forbidden_logging_fields
      autofix_safe: false
    # `metavariable-regex` only constrains a match when it is an item of a
    # `patterns` list. As a sibling of `pattern-either` it is silently dropped
    # (the config still validates), which left this rule matching EVERY logger
    # call carrying at least one argument -- including `logging.getLogger(...)`.
    #
    # $SECRET binds any argument EXPRESSION, string literals included, so a
    # regex over its whole text fired on message prose: "Failed to decode JWT
    # claims from token", "Tenant not in token allowed_tenants; request
    # refused", and an implicitly concatenated "L9_API_KEY is not set ..."
    # warning -- none of which logs a value. The secret-like name must now sit
    # in a code position inside the argument (see the metavariable-pattern
    # below). Searching INSIDE the argument keeps every real leak shape the
    # whole-text regex caught -- "x %s" % api_key, "x {}".format(token),
    # str(creds["password"]) -- and adds keyword values (extra={...}), which
    # the positional-only form never matched. Secret references inside an
    # f-string are AST-LOGGING-003's, so they are excluded here to keep one
    # finding per leak.
    #
    # Token COUNTS are not token VALUES. `token` also names LLM usage, and
    # Enrichment.Inference.Engine (12d8b351) was blocked by sixteen AST-LOGGING
    # 001/002 findings that each logged a usage figure: tokens=total_tokens,
    # prompt_tokens=usage.get("prompt_tokens"), tokens_used=response.tokens_used,
    # total_tokens=cost_tracker.total_tokens. Each secret-name condition
    # (here, in AST-LOGGING-002 and in AST-LOGGING-003) therefore carries one
    # more regex that drops a name in a token-count form:
    #   * <qualifier>_tokens, plural only, for total, prompt, completion,
    #     input, output, reasoning, max, num and n;
    #   * tokens_used / _count / _total / _budget / _limit / _usage /
    #     _per_<x>, token_count, tokencount;
    #   * tokenize / tokenizer / tokenized / tokenization.
    # The exemption is void when the name ALSO carries a credential qualifier
    # (access, refresh, auth, bearer, session, oauth, jwt, csrf, id_token,
    # api_token, client, private, signing, reset, verif..., invite, magic,
    # personal, or any other secret word), so access_token, refresh_tokens,
    # auth_tokens_used and api_key_tokens_total are still reported. Qualifiers
    # that name a credential as plausibly as a count (cached_tokens,
    # generated_tokens, used_tokens, input_token singular) are deliberately
    # NOT exempt. tests/fixtures/semgrep/rules/python/l9-logging.py pins both
    # directions.
    patterns:
      - pattern-either:
          - pattern: logger.$LEVEL(..., $SECRET, ...)
          - pattern: logging.$LEVEL(..., $SECRET, ...)
          - pattern: logger.$LEVEL(..., $KWARG=$SECRET, ...)
          - pattern: logging.$LEVEL(..., $KWARG=$SECRET, ...)
      - metavariable-regex:
          metavariable: $LEVEL
          regex: ^(debug|info|warning|error|exception|critical|log)$
      - metavariable-pattern:
          metavariable: $SECRET
          patterns:
            - pattern-not-inside: f"..."
            # A secret-like name in a CODE position: a bare identifier
            # (api_key, get_token), an attribute (self.token,
            # client.get_token), a subscript key (creds["password"],
            # os.environ["API_KEY"]), a dict-literal key (extra={"secret": s}),
            # a keyword passed to a nested call (dict(token=t)), or a
            # name-shaped literal handed to a nested call (os.getenv("TOKEN")).
            # Prose in a message literal is none of these, which is the point.
            - pattern-either:
                - patterns:
                    - pattern: $NAME
                    - metavariable-regex:
                        metavariable: $NAME
                        regex: ^[A-Za-z_][A-Za-z0-9_]*$
                    - metavariable-regex:
                        metavariable: $NAME
                        regex: '(?i).*(api_key|token|password|secret|raw_response|llm_response).*'
                    - metavariable-regex:
                        metavariable: $NAME
                        regex: '(?i)^(?!(?!.*(?:api_key|password|secret|raw_response|llm_response|access|refresh|auth|bearer|session|oauth|jwt|csrf|id_token|api_token|client|private|signing|reset|verif|invite|magic|personal)).*(?:^|[^a-z0-9])(?:(?:total|prompt|completion|input|output|reasoning|max|num|n)_tokens|tokens?_(?:used|count|counts|total|totals|budget|limit|limits|usage|per_[a-z0-9]+)|token_?count|tokeni[sz](?:e|er|ers|ed|es|ing|ation))(?:$|[^a-z0-9]))'
                - patterns:
                    - pattern: $OBJ.$ATTR
                    - metavariable-regex:
                        metavariable: $ATTR
                        regex: '(?i).*(api_key|token|password|secret|raw_response|llm_response).*'
                    - metavariable-regex:
                        metavariable: $ATTR
                        regex: '(?i)^(?!(?!.*(?:api_key|password|secret|raw_response|llm_response|access|refresh|auth|bearer|session|oauth|jwt|csrf|id_token|api_token|client|private|signing|reset|verif|invite|magic|personal)).*(?:^|[^a-z0-9])(?:(?:total|prompt|completion|input|output|reasoning|max|num|n)_tokens|tokens?_(?:used|count|counts|total|totals|budget|limit|limits|usage|per_[a-z0-9]+)|token_?count|tokeni[sz](?:e|er|ers|ed|es|ing|ation))(?:$|[^a-z0-9]))'
                - patterns:
                    - pattern: $OBJ[$KEY]
                    - metavariable-regex:
                        metavariable: $KEY
                        regex: '(?i).*(api_key|token|password|secret|raw_response|llm_response).*'
                    - metavariable-regex:
                        metavariable: $KEY
                        regex: '(?i)^(?!(?!.*(?:api_key|password|secret|raw_response|llm_response|access|refresh|auth|bearer|session|oauth|jwt|csrf|id_token|api_token|client|private|signing|reset|verif|invite|magic|personal)).*(?:^|[^a-z0-9])(?:(?:total|prompt|completion|input|output|reasoning|max|num|n)_tokens|tokens?_(?:used|count|counts|total|totals|budget|limit|limits|usage|per_[a-z0-9]+)|token_?count|tokeni[sz](?:e|er|ers|ed|es|ing|ation))(?:$|[^a-z0-9]))'
                - patterns:
                    - pattern: '{..., $KEY: $VAL, ...}'
                    - metavariable-regex:
                        metavariable: $KEY
                        regex: '(?i).*(api_key|token|password|secret|raw_response|llm_response).*'
                    - metavariable-regex:
                        metavariable: $KEY
                        regex: '(?i)^(?!(?!.*(?:api_key|password|secret|raw_response|llm_response|access|refresh|auth|bearer|session|oauth|jwt|csrf|id_token|api_token|client|private|signing|reset|verif|invite|magic|personal)).*(?:^|[^a-z0-9])(?:(?:total|prompt|completion|input|output|reasoning|max|num|n)_tokens|tokens?_(?:used|count|counts|total|totals|budget|limit|limits|usage|per_[a-z0-9]+)|token_?count|tokeni[sz](?:e|er|ers|ed|es|ing|ation))(?:$|[^a-z0-9]))'
                - patterns:
                    - pattern: $FUNC(..., $KW=$VAL, ...)
                    - metavariable-regex:
                        metavariable: $KW
                        regex: '(?i).*(api_key|token|password|secret|raw_response|llm_response).*'
                    - metavariable-regex:
                        metavariable: $KW
                        regex: '(?i)^(?!(?!.*(?:api_key|password|secret|raw_response|llm_response|access|refresh|auth|bearer|session|oauth|jwt|csrf|id_token|api_token|client|private|signing|reset|verif|invite|magic|personal)).*(?:^|[^a-z0-9])(?:(?:total|prompt|completion|input|output|reasoning|max|num|n)_tokens|tokens?_(?:used|count|counts|total|totals|budget|limit|limits|usage|per_[a-z0-9]+)|token_?count|tokeni[sz](?:e|er|ers|ed|es|ing|ation))(?:$|[^a-z0-9]))'
                - patterns:
                    - pattern: $FUNC(..., $ARG, ...)
                    # Name-shaped literal only (no whitespace): an env-var or
                    # key name, never a sentence such as _("Invalid token").
                    - metavariable-regex:
                        metavariable: $ARG
                        regex: ^[rRbBuU]*["'][A-Za-z0-9_.:/-]*(?i:api_key|token|password|secret|raw_response|llm_response)[A-Za-z0-9_.:/-]*["']$
                    - metavariable-regex:
                        metavariable: $ARG
                        regex: '(?i)^(?!(?!.*(?:api_key|password|secret|raw_response|llm_response|access|refresh|auth|bearer|session|oauth|jwt|csrf|id_token|api_token|client|private|signing|reset|verif|invite|magic|personal)).*(?:^|[^a-z0-9])(?:(?:total|prompt|completion|input|output|reasoning|max|num|n)_tokens|tokens?_(?:used|count|counts|total|totals|budget|limit|limits|usage|per_[a-z0-9]+)|token_?count|tokeni[sz](?:e|er|ers|ed|es|ing|ation))(?:$|[^a-z0-9]))'

  - id: l9.logging.forbidden-secret-keyword
    languages: [python]
    severity: WARNING
    message: Forbidden secret-like keyword passed to logger. Redact or omit sensitive values.
    metadata:
      l9:
        canonical_rule_id: AST-LOGGING-002
      mode: shadow
      contract: forbidden_logging_fields
      autofix_safe: false
    # Was a single-line `pattern-regex` ending in `(api_key|token|...)\s*=`,
    # which also fired on message prose such as "refresh token=%s" and missed
    # every call wrapped across lines. The keyword NAME is now matched as a
    # keyword argument of the logger call itself.
    patterns:
      - pattern-either:
          - pattern: logger.$LEVEL(..., $KWARG=$VALUE, ...)
          - pattern: logging.$LEVEL(..., $KWARG=$VALUE, ...)
      - metavariable-regex:
          metavariable: $LEVEL
          regex: ^(debug|info|warning|error|exception|critical|log)$
      - metavariable-regex:
          metavariable: $KWARG
          regex: '(?i).*(api_key|token|password|secret|raw_response|llm_response).*'
      - metavariable-regex:
          metavariable: $KWARG
          regex: '(?i)^(?!(?!.*(?:api_key|password|secret|raw_response|llm_response|access|refresh|auth|bearer|session|oauth|jwt|csrf|id_token|api_token|client|private|signing|reset|verif|invite|magic|personal)).*(?:^|[^a-z0-9])(?:(?:total|prompt|completion|input|output|reasoning|max|num|n)_tokens|tokens?_(?:used|count|counts|total|totals|budget|limit|limits|usage|per_[a-z0-9]+)|token_?count|tokeni[sz](?:e|er|ers|ed|es|ing|ation))(?:$|[^a-z0-9]))'
      # A bare `tokens=` keyword names a count as often as a credential, so
      # it is exempt only when its VALUE is itself a proven count: an integer
      # literal, len()/sum(), or a dotted name in a token-count form
      # (tokens=total_tokens, tokens=response.tokens_used). tokens=refresh_tokens
      # or tokens=user.tokens is still reported.
      - metavariable-comparison:
          comparison: >-
            not (re.match("(?i)^_*tokens$", str($KWARG))
            and re.match("(?i)^[0-9]+$|^(len|sum)[(]|^(?=([a-z_][a-z0-9_]*[.])*[a-z_][a-z0-9_]*$)(?!.*(api_key|password|secret|raw_response|llm_response|access|refresh|auth|bearer|session|oauth|jwt|csrf|id_token|api_token|client|private|signing|reset|verif|invite|magic|personal)).*(?:^|[^a-z0-9])(?:(?:total|prompt|completion|input|output|reasoning|max|num|n)_tokens|tokens?_(?:used|count|counts|total|totals|budget|limit|limits|usage|per_[a-z0-9]+)|token_?count|tokeni[sz](?:e|er|ers|ed|es|ing|ation))(?:$|[^a-z0-9])", str($VALUE)))

  - id: l9.logging.f-string-secret
    languages: [python]
    severity: WARNING
    message: F-string logging of secret-like values is forbidden.
    metadata:
      l9:
        canonical_rule_id: AST-LOGGING-003
      mode: shadow
      contract: forbidden_logging_fields
      autofix_safe: false
    # Was a `pattern-regex` over the raw line after `(f"`, so it fired on the
    # f-string's PROSE ("Refreshing token for {user}") exactly like
    # AST-LOGGING-001 did, and only saw an f-string in first position on one
    # line. It now requires the secret-like name in an interpolated
    # expression of an f-string anywhere in the logger arguments.
    patterns:
      - pattern-either:
          - pattern: logger.$LEVEL(..., $SECRET, ...)
          - pattern: logging.$LEVEL(..., $SECRET, ...)
          - pattern: logger.$LEVEL(..., $KWARG=$SECRET, ...)
          - pattern: logging.$LEVEL(..., $KWARG=$SECRET, ...)
      - metavariable-regex:
          metavariable: $LEVEL
          regex: ^(debug|info|warning|error|exception|critical|log)$
      - metavariable-pattern:
          metavariable: $SECRET
          patterns:
            - pattern-inside: f"..."
            # A secret-like name in a CODE position: a bare identifier
            # (api_key, get_token), an attribute (self.token,
            # client.get_token), a subscript key (creds["password"],
            # os.environ["API_KEY"]), a dict-literal key (extra={"secret": s}),
            # a keyword passed to a nested call (dict(token=t)), or a
            # name-shaped literal handed to a nested call (os.getenv("TOKEN")).
            # Prose in a message literal is none of these, which is the point.
            - pattern-either:
                - patterns:
                    - pattern: $NAME
                    - metavariable-regex:
                        metavariable: $NAME
                        regex: ^[A-Za-z_][A-Za-z0-9_]*$
                    - metavariable-regex:
                        metavariable: $NAME
                        regex: '(?i).*(api_key|token|password|secret|raw_response|llm_response).*'
                    - metavariable-regex:
                        metavariable: $NAME
                        regex: '(?i)^(?!(?!.*(?:api_key|password|secret|raw_response|llm_response|access|refresh|auth|bearer|session|oauth|jwt|csrf|id_token|api_token|client|private|signing|reset|verif|invite|magic|personal)).*(?:^|[^a-z0-9])(?:(?:total|prompt|completion|input|output|reasoning|max|num|n)_tokens|tokens?_(?:used|count|counts|total|totals|budget|limit|limits|usage|per_[a-z0-9]+)|token_?count|tokeni[sz](?:e|er|ers|ed|es|ing|ation))(?:$|[^a-z0-9]))'
                - patterns:
                    - pattern: $OBJ.$ATTR
                    - metavariable-regex:
                        metavariable: $ATTR
                        regex: '(?i).*(api_key|token|password|secret|raw_response|llm_response).*'
                    - metavariable-regex:
                        metavariable: $ATTR
                        regex: '(?i)^(?!(?!.*(?:api_key|password|secret|raw_response|llm_response|access|refresh|auth|bearer|session|oauth|jwt|csrf|id_token|api_token|client|private|signing|reset|verif|invite|magic|personal)).*(?:^|[^a-z0-9])(?:(?:total|prompt|completion|input|output|reasoning|max|num|n)_tokens|tokens?_(?:used|count|counts|total|totals|budget|limit|limits|usage|per_[a-z0-9]+)|token_?count|tokeni[sz](?:e|er|ers|ed|es|ing|ation))(?:$|[^a-z0-9]))'
                - patterns:
                    - pattern: $OBJ[$KEY]
                    - metavariable-regex:
                        metavariable: $KEY
                        regex: '(?i).*(api_key|token|password|secret|raw_response|llm_response).*'
                    - metavariable-regex:
                        metavariable: $KEY
                        regex: '(?i)^(?!(?!.*(?:api_key|password|secret|raw_response|llm_response|access|refresh|auth|bearer|session|oauth|jwt|csrf|id_token|api_token|client|private|signing|reset|verif|invite|magic|personal)).*(?:^|[^a-z0-9])(?:(?:total|prompt|completion|input|output|reasoning|max|num|n)_tokens|tokens?_(?:used|count|counts|total|totals|budget|limit|limits|usage|per_[a-z0-9]+)|token_?count|tokeni[sz](?:e|er|ers|ed|es|ing|ation))(?:$|[^a-z0-9]))'
                - patterns:
                    - pattern: '{..., $KEY: $VAL, ...}'
                    - metavariable-regex:
                        metavariable: $KEY
                        regex: '(?i).*(api_key|token|password|secret|raw_response|llm_response).*'
                    - metavariable-regex:
                        metavariable: $KEY
                        regex: '(?i)^(?!(?!.*(?:api_key|password|secret|raw_response|llm_response|access|refresh|auth|bearer|session|oauth|jwt|csrf|id_token|api_token|client|private|signing|reset|verif|invite|magic|personal)).*(?:^|[^a-z0-9])(?:(?:total|prompt|completion|input|output|reasoning|max|num|n)_tokens|tokens?_(?:used|count|counts|total|totals|budget|limit|limits|usage|per_[a-z0-9]+)|token_?count|tokeni[sz](?:e|er|ers|ed|es|ing|ation))(?:$|[^a-z0-9]))'
                - patterns:
                    - pattern: $FUNC(..., $KW=$VAL, ...)
                    - metavariable-regex:
                        metavariable: $KW
                        regex: '(?i).*(api_key|token|password|secret|raw_response|llm_response).*'
                    - metavariable-regex:
                        metavariable: $KW
                        regex: '(?i)^(?!(?!.*(?:api_key|password|secret|raw_response|llm_response|access|refresh|auth|bearer|session|oauth|jwt|csrf|id_token|api_token|client|private|signing|reset|verif|invite|magic|personal)).*(?:^|[^a-z0-9])(?:(?:total|prompt|completion|input|output|reasoning|max|num|n)_tokens|tokens?_(?:used|count|counts|total|totals|budget|limit|limits|usage|per_[a-z0-9]+)|token_?count|tokeni[sz](?:e|er|ers|ed|es|ing|ation))(?:$|[^a-z0-9]))'
                - patterns:
                    - pattern: $FUNC(..., $ARG, ...)
                    # Name-shaped literal only (no whitespace): an env-var or
                    # key name, never a sentence such as _("Invalid token").
                    - metavariable-regex:
                        metavariable: $ARG
                        regex: ^[rRbBuU]*["'][A-Za-z0-9_.:/-]*(?i:api_key|token|password|secret|raw_response|llm_response)[A-Za-z0-9_.:/-]*["']$
                    - metavariable-regex:
                        metavariable: $ARG
                        regex: '(?i)^(?!(?!.*(?:api_key|password|secret|raw_response|llm_response|access|refresh|auth|bearer|session|oauth|jwt|csrf|id_token|api_token|client|private|signing|reset|verif|invite|magic|personal)).*(?:^|[^a-z0-9])(?:(?:total|prompt|completion|input|output|reasoning|max|num|n)_tokens|tokens?_(?:used|count|counts|total|totals|budget|limit|limits|usage|per_[a-z0-9]+)|token_?count|tokeni[sz](?:e|er|ers|ed|es|ing|ation))(?:$|[^a-z0-9]))'
