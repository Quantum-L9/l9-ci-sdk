---
schema: l9.identity-map/v1
metadata:
  provider_id: semgrep
  version: 1.3.0
  status: authoritative
# Provenance: every provider_rule_id below is a REAL Semgrep registry check_id,
# captured by running `semgrep --config <pack>` against local synthetic
# vulnerable fixtures (never production code, never fabricated) and reading
# each finding's own message text to confirm semantics before choosing a
# canonical_rule_id. No entry is guessed from severity, confidence, or rule
# name alone. Packs queried: p/python, p/security-audit, p/owasp-top-ten,
# p/bandit, p/javascript, p/typescript, p/expressjs, p/eslint-plugin-security.
#
# This map only resolves identity for THIRD-PARTY registry rules (e.g. the
# `p/python` / `p/security-audit` configs the downstream l9-analysis*.yml
# workflows run). L9-authored rules under l9_ci/rulesets/semgrep/ already
# carry trusted `metadata.l9.canonical_rule_id` and never need an entry here
# -- resolve_rule_identity() gives trusted metadata priority over this map.
rules:
  # --- exec()/eval() dynamic code execution ---
  python.lang.security.audit.eval-detected.eval-detected:
    canonical_rule_id: L9-PYTHON-EXEC-EVAL-USE
  python.lang.security.audit.exec-detected.exec-detected:
    canonical_rule_id: L9-PYTHON-EXEC-EVAL-USE
  gitlab.bandit.B102:
    canonical_rule_id: L9-PYTHON-EXEC-EVAL-USE
  gitlab.bandit.B307:
    canonical_rule_id: L9-PYTHON-EXEC-EVAL-USE

  # --- subprocess shell=True ---
  python.lang.security.audit.subprocess-shell-true.subprocess-shell-true:
    canonical_rule_id: L9-PYTHON-SUBPROCESS-SHELL-TRUE
  gitlab.bandit.B602:
    canonical_rule_id: L9-PYTHON-SUBPROCESS-SHELL-TRUE

  # --- subprocess invoked with tainted (user-controlled) argv, no shell ---
  # Distinct MECHANISM from shell=True above: the command is a list, argv[0] is
  # fixed, and no shell interprets it -- so L9-PYTHON-SUBPROCESS-SHELL-TRUE does
  # NOT describe this rule. Semantics read from the rule's own output against
  # l9-cognitive-runtime@45d87e9: message "Detected subprocess function with
  # user controlled data", metadata.cwe "CWE-78: ... OS Command Injection",
  # metadata.vulnerability_class "Command Injection", owasp "A03:2021 -
  # Injection". Not guessed from severity, confidence, or rule name.
  python.lang.security.audit.dangerous-subprocess-use-tainted-env-args.dangerous-subprocess-use-tainted-env-args:
    canonical_rule_id: L9-PYTHON-SUBPROCESS-TAINTED-ARGS
  # Same MECHANISM, different registry pack. Semantics read from the rule's own
  # output against l9-ci-sdk@da4d228 (l9_ci/providers/semgrep/provider.py:145,
  # a list-form subprocess.run with no shell=True whose argv carries
  # caller-supplied arguments): message "Detected user input entering a
  # `subprocess` call unsafely. This could result in a command injection
  # vulnerability", metadata.cwe "CWE-78: ... OS Command Injection",
  # metadata.vulnerability_class "Command Injection", owasp "A03:2021 -
  # Injection" -- identical classification to the entry above. The `django.`
  # prefix is the pack's namespace, not a framework precondition; the rule
  # matches plain subprocess calls. Not guessed from severity or rule name.
  python.django.security.injection.command.subprocess-injection.subprocess-injection:
    canonical_rule_id: L9-PYTHON-SUBPROCESS-TAINTED-ARGS

  # --- unsafe deserialization (pickle) ---
  python.lang.security.deserialization.pickle.avoid-pickle:
    canonical_rule_id: L9-PYTHON-UNSAFE-DESERIALIZATION
  gitlab.bandit.B301-1:
    canonical_rule_id: L9-PYTHON-UNSAFE-DESERIALIZATION

  # --- SQL built via string formatting ---
  python.lang.security.audit.formatted-sql-query.formatted-sql-query:
    canonical_rule_id: L9-PYTHON-SQL-STRING-FORMAT
  gitlab.bandit.B608:
    canonical_rule_id: L9-PYTHON-SQL-STRING-FORMAT

  # --- TLS certificate verification disabled ---
  python.requests.security.disabled-cert-validation.disabled-cert-validation:
    canonical_rule_id: L9-PYTHON-TLS-VERIFY-DISABLED
  gitlab.bandit.B501:
    canonical_rule_id: L9-PYTHON-TLS-VERIFY-DISABLED

  # --- TypeScript/JavaScript: child_process exec ---
  javascript.lang.security.detect-child-process.detect-child-process:
    canonical_rule_id: L9-TS-CHILD-PROCESS-EXEC

  # --- TypeScript/JavaScript: hardcoded JWT secret ---
  javascript.jsonwebtoken.security.jwt-hardcode.hardcoded-jwt-secret:
    canonical_rule_id: L9-TS-JWT-INSECURE
