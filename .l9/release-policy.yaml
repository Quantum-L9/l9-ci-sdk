---
schema: l9.release-policy/v1
metadata:
  repository: Quantum-L9/l9-ci-sdk
  version: 2.0.0

release_channels:
  experimental:
    requirements:
      - provider implementation exists
      - representative fixture exists
      - unit tests pass
      - schema tests pass
  shadow:
    requirements:
      - runtime-captured redacted fixture exists
      - provider version is recorded
      - deterministic bundle test passes
      - malformed report behavior is tested
      - timeout behavior is tested
      - output limit behavior is tested
      - no raw secret or source snippet leakage
      - Core integration path publishes canonical technical gate results
  supported:
    requirements:
      - shadow observation completed
      - stable identity behavior confirmed
      - compatibility fixtures published
      - migration notes published
      - release checklist completed
      - known limitations accepted
      - supported Semgrep version range documented

Semgrep:
  current_state: experimental
  target_state: shadow
  blockers: []
  evidence:
    runtime_fixture: tests/fixtures/semgrep/runtime/provenance.yaml
    version_range: ">=1.100.0,<2.0.0"
    core_gate_publication: "https://github.com/Quantum-L9/l9-ci-sdk/actions/runs/30640182783"
    core_gate_check: "https://github.com/Quantum-L9/l9-ci-sdk/actions/runs/30640182783/job/91188145152"
    required_check_ruleset: "https://github.com/Quantum-L9/l9-ci-sdk/rules/20147356"
    validation_artifact: "https://github.com/Quantum-L9/l9-ci-sdk/actions/runs/30640182197/artifacts/8797085061"

ObservationV2:
  protocol: l9.observation/v1
  producer_version: 2.0.0
  current_state: candidate
  target_state: shadow
  supported_checks:
    - l9.repository-metadata
    - l9.transport-packet
    - l9.sdk-validation
    - l9.lint
    - l9.tests
    - l9.mandatory-findings
  promotion_requirements:
    - deterministic observation identity tests pass
    - exact revision binding tests pass
    - observation schema validation passes
    - mandatory-findings fidelity tests pass
    - Core consumes exact v2 SDK revision in a real GitHub Actions canary
    - all six required observation classes are emitted for one exact revision
    - Assurance admits the exact candidate producer build without schema translation
  blockers:
    - real Core-to-SDK-v2 canary not yet evidenced
    - complete six-observation execution not yet evidenced
    - Assurance production producer trust activation not yet evidenced
