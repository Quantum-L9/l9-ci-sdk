---
schema: l9.ownership-spec/v1
repository: Quantum-L9/l9-ci-sdk

ownership:
  l9_ci/contracts:
    owns:
      - canonical models
      - canonical enums
      - local invariants
  l9_ci/repository:
    owns:
      - file enumeration
      - Git repository inspection
      - snapshot identity
  l9_ci/capabilities:
    owns:
      - language detection
      - repository capability detection
      - provider candidacy signals
  l9_ci/providers:
    owns:
      - provider SPI
      - provider-native parsing
      - provider execution
      - provider normalization
      - provider coverage
      - provider failures
  l9_ci/identity:
    owns:
      - canonical identity resolution
      - versioned identity maps
  l9_ci/policy:
    owns:
      - policy parsing
      - finding classification
  l9_ci/execution:
    owns:
      - execution profiles
      - provider selection primitives
  l9_ci/artifacts:
    owns:
      - canonical serialization
      - schema validation
      - semantic validation
      - atomic writes
  l9_ci/gates:
    owns:
      - technical pass, fail, incomplete, and invalid outcomes
  l9_ci/integration:
    owns:
      - compatibility negotiation
      - operational limits
      - redaction validation
      - non-canonical projections
      - l9.observation/v1 construction and validation
      - mandatory-findings observation projection
  l9_ci/cli:
    owns:
      - stable exit codes
      - CLI output format
      - structured diagnostics
  l9_ci/rulesets:
    owns:
      - versioned SDK-packaged provider rules
      - packaged provider identity maps

external_boundaries:
  l9-ci-core:
    relationship: orchestrator_consumer
    allowed:
      - invoke public CLI
      - select centrally governed execution inputs
      - select required providers
      - enforce SDK technical gates
      - upload and publish SDK artifacts
      - request factual observation construction
    prohibited:
      - parse provider-native reports
      - reconstruct canonical findings
      - mutate canonical bundles
      - synthesize rule identity
      - construct l9.observation/v1 without SDK validation
  l9-assurance:
    relationship: decision_consumer
    allowed:
      - admit trusted SDK observations
      - evaluate controls against exact-revision observations
      - issue final Assurance decisions
    prohibited:
      - redefine SDK provider facts
  Quantum-L9/.github:
    relationship: none_for_ci_distribution
    prohibited:
      - distribute SDK/Core CI workflows
      - distribute organization governance packs

workflow_ownership:
  owner: l9-ci-core
  statement: >-
    l9-ci-core owns organization CI orchestration and GitHub permissions. The
    SDK never becomes a workflow-distribution authority. Any workflows in this
    repository are SDK self-CI/dogfood surfaces, not organization templates.

final_decision_boundary:
  SDK_gate: technical_evaluation_only
  Assurance_decision: authoritative_organization_policy_verdict
  invariant: >-
    SDK technical gate output must never be relabeled or reconstructed as an
    Assurance decision.
