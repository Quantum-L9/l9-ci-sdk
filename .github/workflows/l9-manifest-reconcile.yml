# L9 repository manifest reconcile (auto-fix bot)
#
# Dual-purpose file: this is BOTH the live dogfood workflow for l9-ci-sdk and
# the copy-in template for downstream consumer repositories.
#
# Dogfood path (this repo):
#   Checkout the PR head, then run the SDK from the working tree:
#     PYTHONPATH=. python -m l9_ci manifest generate ...
#
# Consumer copy-in path (other repos — replace the generate step):
#   1. Keep permissions, concurrency, commit, and fork-patch steps as-is.
#   2. After checkout, provision an immutable SDK that includes `manifest`:
#        - id: sdk
#          uses: Quantum-L9/l9-ci-core/.github/actions/provision-sdk@<pinned-core-sha>
#   3. Generate with the provisioned executable (do NOT use PYTHONPATH=.):
#        "${{ steps.sdk.outputs.executable }}" manifest generate \
#          --repository-root . --output MANIFEST.md --tracked-only \
#          --exclude-dir memory-bank
#   4. Pin an SDK revision that includes the manifest CLI (via whatever pin
#      mechanism provision-sdk already uses for analysis callers).
#
# Core reusable workflow packaging is intentionally out of scope; consumers
# adopt by copying this file and switching to provision-sdk as above.

name: L9 Manifest Reconcile

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: l9-manifest-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  reconcile:
    name: Reconcile repository manifest
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout PR head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          # Bot may push a reconcile commit to the PR head on same-repo PRs.
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"

      - name: Install SDK runtime deps
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Generate manifest from repository truth
        id: manifest
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD"
          # memory-bank/ is a local agent scratchpad (incl. WIP); never inventory it.
          python -m l9_ci manifest generate \
            --repository-root . \
            --output MANIFEST.md \
            --tracked-only \
            --exclude-dir memory-bank
          if git diff --quiet -- MANIFEST.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff -- MANIFEST.md
          fi

      - name: Commit manifest correction to PR
        if: >-
          steps.manifest.outputs.changed == 'true' &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name "l9-manifest-bot"
          git config user.email "l9-manifest-bot@users.noreply.github.com"
          git checkout -B "$HEAD_REF"
          git add MANIFEST.md
          git commit -m "chore(manifest): reconcile repository truth"
          git push origin "HEAD:$HEAD_REF"
          echo "Manifest corrected. The synchronize event starts CI again on the new head."

      - name: Export fork patch
        if: >-
          steps.manifest.outputs.changed == 'true' &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name != github.repository
        run: git diff --binary -- MANIFEST.md > manifest-reconcile.patch

      - name: Upload fork reconciliation patch
        if: >-
          steps.manifest.outputs.changed == 'true' &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name != github.repository
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: manifest-reconcile-patch
          path: manifest-reconcile.patch
          if-no-files-found: error
          retention-days: 14
