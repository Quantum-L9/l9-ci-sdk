---
# L9 SDK repository reconciliation bot.
#
# This workflow is self-maintenance for l9-ci-sdk only. It is NOT a copy-in
# template and must not be distributed through Quantum-L9/.github or seeded
# into consumer repositories.
#
# It reconciles two deterministic repository-derived artifacts:
#   1. MANIFEST.md from tracked repository truth.
#   2. The editable root package version recorded in uv.lock from pyproject.toml.
#
# The uv.lock reconciliation intentionally changes only the editable root
# package's version field. Dependency changes still require a real `uv lock`;
# this step prevents producer identity drift when the project version changes.
#
# Detection only, never a push. A commit pushed with the workflow GITHUB_TOKEN
# starts no new workflow run (GitHub's recursion guard), so a bot reconcile
# commit left the PR head with its required checks never run or held at
# `action_required` (l9-ci-sdk#117, head df39e1e6). The workflow therefore
# fails on drift, prints the diff and the exact regeneration command, and
# uploads the fix as a patch artifact for every PR, same-repository or fork.
# The author applies it and pushes; that push is a normal `synchronize` event.

name: L9 Manifest Reconcile

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: l9-manifest-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  reconcile:
    name: Reconcile repository derived state
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          # Read-only: this workflow never pushes (see header).
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install SDK runtime deps
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Reconcile editable root version in uv.lock
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib
          import re
          import tomllib

          pyproject = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))
          expected = pyproject["project"]["version"]
          lock_path = pathlib.Path("uv.lock")
          text = lock_path.read_text(encoding="utf-8")

          pattern = re.compile(
              r'(\[\[package\]\]\nname = "l9-ci"\nversion = ")([^"]+)("\nsource = \{ editable = "\." \})'
          )
          matches = list(pattern.finditer(text))
          if len(matches) != 1:
              raise SystemExit(
                  f"expected exactly one editable l9-ci root package in uv.lock, found {len(matches)}"
              )
          current = matches[0].group(2)
          if current != expected:
              text = pattern.sub(rf'\g<1>{expected}\g<3>', text, count=1)
              lock_path.write_text(text, encoding="utf-8")
              print(f"uv.lock editable root version: {current} -> {expected}")
          else:
              print(f"uv.lock editable root version already aligned: {expected}")
          PY

      - name: Generate manifest from repository truth
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD"
          # memory-bank/ is local agent scratch/history, never product inventory.
          python -m l9_ci manifest generate \
            --repository-root . \
            --output MANIFEST.md \
            --tracked-only \
            --exclude-dir memory-bank

      - name: Detect reconciliation changes
        id: reconcile
        run: |
          set -euo pipefail
          if git diff --quiet -- MANIFEST.md uv.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff -- MANIFEST.md uv.lock
          fi

      - name: Export reconciliation patch
        if: steps.reconcile.outputs.changed == 'true'
        run: git diff --binary -- MANIFEST.md uv.lock > repository-reconcile.patch

      - name: Upload reconciliation patch
        if: steps.reconcile.outputs.changed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: repository-reconcile-patch
          path: repository-reconcile.patch
          if-no-files-found: error
          retention-days: 14

      - name: Fail on derived-state drift
        if: steps.reconcile.outputs.changed == 'true'
        run: |
          msg="MANIFEST.md or the uv.lock root version does not match tracked truth."
          msg="$msg Regenerate locally and push, or apply the repository-reconcile-patch artifact."
          echo "::error title=Derived repository state is stale::$msg"
          echo "Regenerate with:"
          echo "  PYTHONPATH=\"\$PWD\" python -m l9_ci manifest generate --repository-root . --output MANIFEST.md --tracked-only --exclude-dir memory-bank"
          echo "A uv.lock root-version change is in the patch only; apply it with:"
          echo "  git apply repository-reconcile.patch"
          exit 1
