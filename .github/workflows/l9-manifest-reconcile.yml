---
# L9 SDK repository reconciliation bot.
#
# This workflow is self-maintenance for l9-ci-sdk only. It is NOT a copy-in
# template and must not be distributed through Quantum-L9/.github or seeded
# into consumer repositories.
#
# It reconciles two deterministic repository-derived artifacts:
#   1. MANIFEST.md from tracked repository truth.
#   2. The editable root package version recorded in uv.lock from pyproject.toml.
#
# The uv.lock reconciliation intentionally changes only the editable root
# package's version field. Dependency changes still require a real `uv lock`;
# this step prevents producer identity drift when the project version changes.

name: L9 Manifest Reconcile

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: l9-manifest-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  reconcile:
    name: Reconcile repository derived state
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          # Bot may push a reconcile commit to same-repository PR heads.
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install SDK runtime deps
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Reconcile editable root version in uv.lock
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib
          import re
          import tomllib

          pyproject = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))
          expected = pyproject["project"]["version"]
          lock_path = pathlib.Path("uv.lock")
          text = lock_path.read_text(encoding="utf-8")

          pattern = re.compile(
              r'(\[\[package\]\]\nname = "l9-ci"\nversion = ")([^"]+)("\nsource = \{ editable = "\." \})'
          )
          matches = list(pattern.finditer(text))
          if len(matches) != 1:
              raise SystemExit(
                  f"expected exactly one editable l9-ci root package in uv.lock, found {len(matches)}"
              )
          current = matches[0].group(2)
          if current != expected:
              text = pattern.sub(rf'\g<1>{expected}\g<3>', text, count=1)
              lock_path.write_text(text, encoding="utf-8")
              print(f"uv.lock editable root version: {current} -> {expected}")
          else:
              print(f"uv.lock editable root version already aligned: {expected}")
          PY

      - name: Generate manifest from repository truth
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD"
          # memory-bank/ is local agent scratch/history, never product inventory.
          python -m l9_ci manifest generate \
            --repository-root . \
            --output MANIFEST.md \
            --tracked-only \
            --exclude-dir memory-bank

      - name: Detect reconciliation changes
        id: reconcile
        run: |
          set -euo pipefail
          if git diff --quiet -- MANIFEST.md uv.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff -- MANIFEST.md uv.lock
          fi

      - name: Commit reconciliation to PR
        if: >-
          steps.reconcile.outputs.changed == 'true' &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name "l9-manifest-bot"
          git config user.email "l9-manifest-bot@users.noreply.github.com"
          git checkout -B "$HEAD_REF"
          git add -- MANIFEST.md uv.lock
          git commit -m "chore(repo): reconcile derived repository state"
          git push origin "HEAD:$HEAD_REF"
          echo "Derived state corrected. The synchronize event starts CI again on the new head."

      - name: Export fork patch
        if: >-
          steps.reconcile.outputs.changed == 'true' &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name != github.repository
        run: git diff --binary -- MANIFEST.md uv.lock > repository-reconcile.patch

      - name: Upload fork reconciliation patch
        if: >-
          steps.reconcile.outputs.changed == 'true' &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name != github.repository
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: repository-reconcile-patch
          path: repository-reconcile.patch
          if-no-files-found: error
          retention-days: 14
