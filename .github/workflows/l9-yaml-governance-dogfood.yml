---
# Dogfood caller for L9 YAML Governance in this repository.
# Invokes the local reusable workflow (avoids chicken/egg SDK SHA pin).
name: L9 YAML Governance Dogfood

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: l9-yaml-governance-dogfood-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  yaml-governance:
    uses: ./.github/workflows/l9-yaml-governance.yml
    permissions:
      contents: read
    with:
      infra-paths: '.github/ .l9/ .semgrep/'
      data-paths: 'tests/fixtures/'
      config-root: 'lint'
      tools-root: 'lint'
      # First activation: every finding gate is advisory (full scan, do not fail).
      # Promote individual flags per promotion-policy.yaml after a clean window.
      enforce-yamllint: false
      enforce-governance: false
      enforce-actionlint: false
      enforce-zizmor: false
