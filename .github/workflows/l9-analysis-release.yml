---
# Thin caller (v2 orchestration handoff). All analysis logic lives in the
# Core-owned reusable kernel:
#   Quantum-L9/l9-ci-core/.github/workflows/analyze-semgrep.yml
# Core owns governance resolution, SDK provisioning at the Core pin,
# 'l9-ci semgrep run' (provider execution + normalization), bundle
# validation, 'l9-ci gate evaluate' (the single gate-decision authority),
# artifact routing/manifest/upload, and check publication. This stub owns
# ONLY the trigger surface, the profile/matrix identity, and concurrency.
# The @SHA below pins the exact Core commit; bump it deliberately together
# with any Core pin review.
name: L9 Analysis (release)
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: l9-analysis-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  analysis:
    uses: Quantum-L9/l9-ci-core/.github/workflows/analyze-semgrep.yml@555d577eb805851b624cf7b0b8fc4df75a225d9f
    permissions:
      actions: read
      checks: write
      contents: read
    with:
      profile: release
      matrix-id: release-semgrep
      language: python
      semgrep-version: "1.171.0"
