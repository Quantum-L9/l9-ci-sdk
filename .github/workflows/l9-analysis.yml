---
name: L9 Analysis
on:
  pull_request:
  workflow_dispatch:
permissions:
  actions: read
  checks: write
  contents: read
  pull-requests: write
concurrency:
  group: l9-analysis-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  analysis:
    name: Core-orchestrated Semgrep analysis
    uses: Quantum-L9/l9-ci-core/.github/workflows/analyze-semgrep.yml@c5924473f4a765e0fbfc8164afff0ae6e57a9ba9
    with:
      profile: pr_fast
      matrix-id: pr-semgrep
      language: python
      semgrep-version: "1.171.0"
      governance-root: .github/governance
      repository-revision: ${{ github.sha }}
      retention-days: 14
      publish: true
