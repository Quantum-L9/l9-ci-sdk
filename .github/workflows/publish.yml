---
# --- L9_META ---
# l9_schema: 1
# origin: l9-ci-sdk
# layer: [ci, release, publish]
# tags: [L9_CI, release, pypi, api-token]
# owner: platform
# status: active
# --- /L9_META ---
#
# Publish the l9-ci SDK to PyPI.
#
# - `workflow_dispatch` builds the sdist/wheel and runs `twine check` ONLY
#   (no publish) — safe to run at any time to validate the package.
# - Pushing a `v*` tag builds, checks, verifies the tag matches the
#   pyproject version, then publishes to PyPI with a project-scoped API
#   token stored as environment secret `PYPI_API_TOKEN` on the GitHub
#   `pypi` environment (synced from AWS `openclaw-igorbot/pypi`).
#
# Scope: Owner Quantum-L9 / repo l9-ci-sdk / workflow publish.yml /
# environment pypi. See docs/PUBLISHING.md.
name: Publish l9-ci SDK

on:
  workflow_dispatch: {}
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: l9-ci-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build-and-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Verify tag matches package version
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os, sys, tomllib, pathlib
          ref = os.environ["REF_NAME"]
          tag_version = ref[1:] if ref.startswith("v") else ref
          data = tomllib.loads(pathlib.Path("pyproject.toml").read_text())
          proj_version = data["project"]["version"]
          if tag_version != proj_version:
              print(f"::error::tag {ref} (version {tag_version}) does not match pyproject version {proj_version}")
              sys.exit(1)
          print(f"tag {ref} matches pyproject version {proj_version}")
          PY
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
      - name: Twine metadata check
        run: python -m twine check dist/*
      - name: Upload distribution artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: l9-ci-dist
          path: dist/*
          if-no-files-found: error

  publish:
    name: publish-to-pypi
    needs: build
    # Publish only on a version-tag push. workflow_dispatch stops after build+check.
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/l9-ci/
    permissions:
      # actions/download-artifact fetches the build artifact from the current
      # run via the Actions API, which requires actions: read when the job
      # overrides the default (restricted) permission set.
      actions: read
      contents: read
    steps:
      - name: Download distribution artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: l9-ci-dist
          path: dist
      - name: Require PyPI API token
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -z "${PYPI_API_TOKEN}" ]; then
            echo "::error::Missing environment secret PYPI_API_TOKEN on GitHub environment 'pypi' (sync from AWS openclaw-igorbot/pypi)."
            exit 1
          fi
      - name: Publish to PyPI (API token)
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247  # v1.14.1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
