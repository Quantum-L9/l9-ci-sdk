version: 2
updates:
  # Python deps: Dependabot's `uv` ecosystem updates pyproject.toml (PEP 621)
  # and uv.lock together in one PR. Observed (#97, bc67819): the same PR also
  # updated requirements-ci.txt, so the CI mirror moves with the lock.
  # requirements.txt holds the runtime pins Core hash-admits
  # (l9-ci-core .l9/sdk-compatibility.yaml `requirements_sha256`); any change
  # to its bytes, by Dependabot or a person, needs a matching Core admission
  # PR before Core can provision that SDK revision.
  # No `pre-commit` entry: Dependabot documents resolving hook `rev:` values
  # from git tags but not `additional_dependencies` (the biome-check pin), so
  # it could bump one copy of a version and not the other. tests/biome and
  # tests/architecture/test_toolchain_pin_alignment.py bind those copies.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      python-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    labels: ["dependencies", "python"]
    commit-message:
      prefix: "deps(uv)"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      github-actions-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    labels: ["dependencies", "github-actions"]
    commit-message:
      prefix: "ci"
