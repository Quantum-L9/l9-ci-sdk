name: Governance Violation
description: Report a repository contract or governance violation
title: "[Gov Violation]: "
labels: ["governance", "violation", "triage"]
assignees: []
body:
  - type: dropdown
    id: violation-type
    attributes:
      label: Violation Type
      options:
        - SDK/Core ownership boundary
        - Provider policy-independence
        - Canonical identity resolution
        - Artifact or schema compatibility
        - Secret or redaction handling
        - CI rule-mode enforcement
        - Generated evidence integrity
        - Other
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      render: shell
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Critical
        - High
        - Medium
        - Low
    validations:
      required: true
  - type: textarea
    id: proposed-fix
    attributes:
      label: Proposed Fix
