# L9_META: origin=Quantum-L9/.github@54306f8a9a03fd16d323d0287d7c8109211d250e; repo=l9-ci-sdk; updated=2026-07-27

name: Bug Report
description: Report a reproducible bug in l9-ci-sdk
title: "[Bug]: "
labels: ["bug", "triage"]
assignees: []
body:
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Exact commands and inputs.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: SDK Version or Commit SHA
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted Logs or Diagnostics
      render: shell
